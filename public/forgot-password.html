<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FamilyBot-MD · Recuperar contraseña</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root {
        --bg-primary: #0a0b0e; --bg-card: #14161c; --text-primary: #f1f5f9; --text-secondary: #94a3b8;
        --accent: #ec4899; --accent-purple: #a855f7; --accent-gradient: linear-gradient(135deg, #ec4899, #a855f7);
        --border-color: rgba(255,255,255,0.07); --radius: 20px;
    }
    :root[data-theme="light"] {
        --bg-primary: #f3f4f8; --bg-card: #ffffff; --text-primary: #1a1d29; --text-secondary: #64748b;
        --border-color: rgba(15,23,42,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; transition: background 0.3s ease, color 0.3s ease; }
    .theme-toggle { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 12px; cursor: pointer; font-size: 1rem; }
    .card { background: var(--bg-card); border-radius: var(--radius); padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 1px solid var(--border-color); transition: background 0.3s ease, border-color 0.3s ease; }
    .brand { text-align: center; font-weight: 800; font-size: 1.4rem; margin-bottom: 6px; }
    .brand span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; margin-top: 16px; }
    input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; color: var(--text-primary); font-size: 0.95rem; outline: none; transition: background 0.3s ease, border-color 0.2s ease; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; margin-top: 26px; background: var(--accent-gradient); border: none; border-radius: 12px; padding: 14px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .msg { margin-top: 16px; font-size: 0.85rem; text-align: center; min-height: 20px; }
    .msg.error { color: #ef4444; }
    .msg.success { color: #22c55e; }
    .reset-link-box { margin-top: 12px; padding: 12px; background: var(--bg-primary); border-radius: 10px; font-size: 0.7rem; word-break: break-all; color: var(--accent); }
    .footer-link { text-align: center; margin-top: 22px; font-size: 0.85rem; color: var(--text-secondary); }
    .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
    <button class="theme-toggle" id="themeBtn"><i class="fas fa-moon"></i></button>
    <div class="card">
        <div class="brand"><span>FamilyBot-MD</span></div>
        <div class="subtitle">Recupera el acceso a tu cuenta</div>

        <form id="forgotForm">
            <label>Correo</label>
            <input type="email" id="email" required placeholder="tu@correo.com">

            <button type="submit" id="submitBtn">Enviar link de recuperación</button>
            <div class="msg" id="msg"></div>
            <div id="resetLinkBox"></div>
        </form>

        <div class="footer-link">¿Ya la recordaste? <a href="/login">Inicia sesión</a></div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('familybot_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function updateThemeIcon() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeBtn').innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        updateThemeIcon();
        document.getElementById('themeBtn').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('familybot_theme', next);
            updateThemeIcon();
        });

        const form = document.getElementById('forgotForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = 'Enviando...';
            msg.className = 'msg';
            msg.innerText = '';
            document.getElementById('resetLinkBox').innerHTML = '';

            const email = document.getElementById('email').value.trim();

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                msg.classList.add(data.status ? 'success' : 'error');
                msg.innerText = data.message;

                if (data.reset_link) {
                    document.getElementById('resetLinkBox').innerHTML =
                        `<div class="reset-link-box"><a href="${data.reset_link}" style="color:inherit">${data.reset_link}</a></div>`;
                }
            } catch (err) {
                msg.classList.add('error');
                msg.innerText = 'No se pudo conectar con el servidor';
            }
            btn.disabled = false;
            btn.innerText = 'Enviar link de recuperación';
        });
    </script>
</body>
</html>
