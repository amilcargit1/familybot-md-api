<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FamilyBot-MD · Mi Perfil</title><style>body{background:#0a0b0e;color:#f1f5f9;font-family:Arial,sans-serif;margin:0}main{max-width:480px;margin:auto;padding:24px 18px}.card{background:#14161c;border:1px solid #252832;border-radius:20px;padding:22px;margin-bottom:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0a0b0e;border-radius:14px;padding:14px}.stat span{display:block;color:#94a3b8;font-size:12px;margin-bottom:6px}.stat strong{font-size:18px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;margin-top:10px}input{background:#0a0b0e;border:1px solid #252832;color:#fff}button{border:0;background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;font-weight:bold}.secondary{background:#0a0b0e;border:1px solid #252832}.key{word-break:break-all;background:#0a0b0e;padding:12px;border-radius:12px;font-family:monospace}.msg{text-align:center;margin-top:10px;min-height:18px}.error{color:#ef4444}.success{color:#22c55e}a{color:#ec4899;text-decoration:none}</style></head>
<body><main><p><a href="/dash">← Volver al Dashboard</a></p><div class="card"><h3>Resumen de uso</h3><div class="stats"><div class="stat"><span>Hoy</span><strong id="today">-</strong></div><div class="stat"><span>Total</span><strong id="total">-</strong></div><div class="stat"><span>Límite</span><strong id="limit">-</strong></div><div class="stat"><span>Restantes</span><strong id="remaining">-</strong></div></div></div><div class="card"><h3>API Key</h3><div class="key" id="key">••••••••</div><button id="copy">Copiar API Key</button><button class="secondary" id="regenFocus">Regenerar API Key</button><div id="keyMsg" class="msg"></div></div><div class="card"><h3>Cuenta</h3><label>Correo</label><input id="email" disabled><label>Usuario</label><input id="username"><label>Nueva contraseña</label><input id="password" type="password"><button id="save">Guardar cambios</button><div id="msg" class="msg"></div></div><div class="card"><h3>Confirmar regeneración</h3><input id="currentPassword" type="password" placeholder="Contraseña actual"><button id="regen">Confirmar regeneración</button><div id="regenMsg" class="msg"></div></div></main>
<script>
let apiKey=localStorage.getItem('familybot_key');if(!apiKey){window.location.replace('/login')}else{document.getElementById('key').textContent=apiKey}
async function loadProfile(){if(!apiKey)return;try{const res=await fetch('/api/auth/me?apiKey='+encodeURIComponent(apiKey));const data=await res.json();if(!res.ok||!data.status){document.getElementById('msg').className='msg error';document.getElementById('msg').textContent='No se pudieron cargar los datos. Tu sesión se mantiene.';return}const d=data.data;document.getElementById('email').value=d.email||'';document.getElementById('username').value=d.username||'';document.getElementById('today').textContent=d.requests?.today??0;document.getElementById('total').textContent=d.requests?.total??0;document.getElementById('limit').textContent=d.requests?.limit??0;document.getElementById('remaining').textContent=d.requests?.remaining??0;localStorage.setItem('familybot_username',d.username||'')}catch{document.getElementById('msg').className='msg error';document.getElementById('msg').textContent='Error de conexión. Tu sesión se mantiene.'}}
loadProfile();document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(apiKey);document.getElementById('keyMsg').className='msg success';document.getElementById('keyMsg').textContent='API Key copiada'}catch{document.getElementById('keyMsg').className='msg error';document.getElementById('keyMsg').textContent='No se pudo copiar'}};document.getElementById('regenFocus').onclick=()=>document.getElementById('currentPassword').focus();document.getElementById('regen').onclick=async()=>{const password=document.getElementById('currentPassword').value;const out=document.getElementById('regenMsg');if(!password){out.className='msg error';out.textContent='Escribe tu contraseña';return}out.className='msg';out.textContent='Regenerando...';try{const res=await fetch('/api/auth/regenerate-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey,password})});const data=await res.json();if(!res.ok||!data.status){out.className='msg error';out.textContent=data.message||'No se pudo regenerar';return}apiKey=data.data.key;localStorage.setItem('familybot_key',apiKey);document.getElementById('key').textContent=apiKey;document.getElementById('currentPassword').value='';out.className='msg success';out.textContent='API Key regenerada correctamente'}catch{out.className='msg error';out.textContent='Error de conexión'}};document.getElementById('save').onclick=async()=>{const out=document.getElementById('msg');out.className='msg';out.textContent='Guardando...';try{const res=await fetch('/api/auth/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey,username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await res.json();if(!res.ok||!data.status){out.className='msg error';out.textContent=data.message||'No se pudo guardar';return}localStorage.setItem('familybot_username',document.getElementById('username').value.trim());document.getElementById('password').value='';out.className='msg success';out.textContent='Cambios guardados'}catch{out.className='msg error';out.textContent='Error de conexión'}};
</script></body></html>
