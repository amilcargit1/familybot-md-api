<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FamilyBot-MD · Catálogo API</title>
<style>
:root{--bg:#07090d;--card:#11151c;--text:#f1f5f9;--muted:#94a3b8;--pink:#ec4899;--cyan:#22d3ee;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--border:rgba(255,255,255,.08)}
:root[data-theme=light]{--bg:#f3f4f8;--card:#fff;--text:#171923;--muted:#64748b;--border:rgba(15,23,42,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand b{color:var(--pink)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer}main{max-width:900px;margin:auto;padding:25px 16px 60px}.hero{text-align:center}.hero h1{margin:0 0 8px}.hero p{color:var(--muted);margin:0}.base{display:inline-block;margin:14px 0;padding:8px 12px;border-radius:9px;background:var(--card);color:var(--cyan);font:12px monospace}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.search,.select{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pill{background:var(--card);border:1px solid var(--border);padding:7px 10px;border-radius:999px;font-size:12px;color:var(--muted)}.group{margin-top:25px}.group h2{font-size:15px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:17px;margin:10px 0}.title{display:flex;justify-content:space-between;gap:10px;align-items:center}.title h3{margin:0;font-size:15px}.method{font:11px monospace;color:var(--cyan);margin-top:5px}.desc{color:var(--muted);font-size:13px;margin:9px 0}.status{font-size:11px;padding:5px 8px;border-radius:999px}.ok{color:var(--green);background:#22c55e1c}.warn{color:var(--yellow);background:#f59e0b1c}.bad{color:var(--red);background:#ef44441c}.unknown{color:var(--muted);background:#94a3b81c}.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.code{flex:1;min-width:0;background:var(--bg);border-radius:8px;padding:9px;font:11px monospace;overflow:auto;color:var(--cyan)}button.copy{white-space:nowrap}.details{margin-top:10px}.details summary{cursor:pointer;color:var(--pink);font-size:12px}.label{font-size:11px;color:var(--muted);margin-top:10px}.empty{text-align:center;color:var(--muted);padding:35px}.cta{text-align:center;margin-top:30px;padding:22px;border-radius:16px;background:linear-gradient(135deg,#ec4899,#a855f7);color:white}.cta a{display:inline-block;margin-top:10px;background:#ffffff2b;padding:9px 15px;border-radius:9px;color:white;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<header><div class="brand">FamilyBot-MD <b>API</b></div><div class="actions"><button class="btn" id="theme">☾</button><a class="btn" href="/">Inicio</a><a class="btn" href="/bot-docs">Bot Docs</a></div></header>
<main>
<section class="hero"><h1>Catálogo de endpoints</h1><p>Consulta, prueba y aprende a integrar la API en tu bot de WhatsApp.</p><div class="base" id="base"></div></section>
<div class="stats"><span class="pill" id="total">Cargando...</span><span class="pill" id="visible"></span><span class="pill">🔐 Nunca mostramos tu API Key</span></div>
<div class="toolbar"><input class="search" id="search" placeholder="🔎 Buscar endpoint, categoría o descripción..."><select class="select" id="category"><option value="">Todas las categorías</option></select></div>
<div id="content"><div class="empty">Cargando catálogo...</div></div>
<div class="cta"><b>¿Quieres usar FamilyBot-MD?</b><div>Regístrate y obtén tu API Key.</div><a href="/register">Crear cuenta</a></div>
</main>
<script>
const origin=location.origin;document.getElementById('base').textContent=origin;
const theme=localStorage.getItem('familybot_theme')||'dark';document.documentElement.dataset.theme=theme;document.getElementById('theme').textContent=theme==='light'?'☀':'☾';document.getElementById('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('familybot_theme',n);document.getElementById('theme').textContent=n==='light'?'☀':'☾'};
let endpoints=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function example(ep){const fields=ep.fields||[];return origin+ep.path+'?'+['apiKey=TU_API_KEY',...fields.map(f=>encodeURIComponent(f.name)+'='+encodeURIComponent(f.default||'valor'))].join('&')}
function waExample(ep){return `const url = ${JSON.stringify(example(ep))};\nconst res = await fetch(url);\nconst data = await res.json();\n// Si devuelve imagen, usa data.result o la respuesta indicada por la documentación.`}
function status(ep){const s=(ep.status||ep.health||'').toLowerCase();if(['ok','available','available_2xx','active'].includes(s))return ['🟢 Disponible','ok'];if(s.includes('auth'))return ['🔵 Requiere autenticación','warn'];if(s.includes('param')||s==='needs_data')return ['🟡 Requiere parámetros','warn'];if(s.includes('error')||s.includes('fail'))return ['🔴 Error','bad'];return ['⚪ No comprobado','unknown']}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),cat=document.getElementById('category').value;const list=endpoints.filter(e=>(!cat||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));document.getElementById('visible').textContent=`${list.length} visibles`;const groups={};list.forEach(e=>(groups[e.categoryLabel||e.category||'Otros']??=[]).push(e));let html='';Object.entries(groups).forEach(([label,items])=>{html+=`<section class="group"><h2>${esc(label)}</h2>`;items.forEach((e,i)=>{const [st,cl]=status(e),uid=(e.path||'ep')+'_'+i,params=(e.fields||[]).map(f=>f.name);html+=`<article class="card"><div class="title"><div><h3>${esc(e.title||e.name||e.path)}</h3><div class="method">${esc(e.method||'GET')} ${esc(e.path)}</div></div><span class="status ${cl}">${st}</span></div><div class="desc">${esc(e.description||'Sin descripción disponible.')}</div><div class="row"><code class="code" id="url_${uid}">${esc(example(e))}</code><button class="btn copy" data-target="url_${uid}">Copiar URL</button></div><div class="label">Parámetros: ${params.length?params.map(esc).join(', '):'apiKey'}</div><details class="details"><summary>🤖 Cómo usarlo en un bot de WhatsApp</summary><div class="label">Ejemplo JavaScript</div><pre class="code">${esc(waExample(e))}</pre><div class="label">cURL</div><pre class="code">${esc('curl "'+example(e)+'"')}</pre>${e.example?`<div class="label">Respuesta de ejemplo</div><pre class="code">${esc(JSON.stringify(e.example,null,2))}</pre>`:''}</details></article>`});html+='</section>'});document.getElementById('content').innerHTML=html||'<div class="empty">No se encontraron endpoints.</div>';document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const t=document.getElementById(b.dataset.target)?.innerText;if(t){await navigator.clipboard.writeText(t);const x=b.textContent;b.textContent='¡Copiado!';setTimeout(()=>b.textContent=x,1200)}})}
async function load(){try{const r=await fetch('/api/endpoints');const d=await r.json();endpoints=Array.isArray(d.endpoints)?d.endpoints:[];document.getElementById('total').textContent=`${endpoints.length} endpoints`;const cats=[...new Set(endpoints.map(e=>e.category).filter(Boolean))];const sel=document.getElementById('category');cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=endpoints.find(e=>e.category===c)?.categoryLabel||c;sel.appendChild(o)});render()}catch(e){document.getElementById('content').innerHTML='<div class="empty">No se pudo cargar el catálogo.</div>'}}document.getElementById('search').oninput=render;document.getElementById('category').onchange=render;load();
</script>
</body>
</html>
