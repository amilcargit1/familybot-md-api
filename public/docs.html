<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FamilyBot-MD · Documentación</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root{--bg-primary:#0a0b0e;--bg-card:#14161c;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--accent:#ec4899;--accent-purple:#a855f7;--accent-cyan:#22d3ee;--accent-gradient:linear-gradient(135deg,#ec4899,#a855f7);--border-color:rgba(255,255,255,.07);--radius:18px}:root[data-theme="light"]{--bg-primary:#f3f4f8;--bg-card:#fff;--text-primary:#1a1d29;--text-secondary:#64748b;--border-color:rgba(15,23,42,.08)}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border-color);position:sticky;top:0;background:var(--bg-primary);z-index:10}.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem}.brand i{color:var(--accent)}.brand span{background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.header-actions{display:flex;gap:8px;align-items:center}.theme-btn,.home-btn,.bot-docs-btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);height:40px;border-radius:12px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.theme-btn,.home-btn{width:40px}.bot-docs-btn{padding:0 12px;gap:7px;font-size:.78rem;font-weight:700}.bot-docs-btn i{color:var(--accent-cyan)}main{max-width:760px;margin:0 auto;padding:24px 18px 60px}.intro{text-align:center;margin-bottom:28px}.intro h1{font-size:1.4rem;margin-bottom:8px}.intro p{color:var(--text-secondary);font-size:.9rem}.base-url{display:inline-flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:8px 14px;font-family:monospace;font-size:.8rem;color:var(--accent-cyan);margin-top:14px}h2.section-title{font-size:1rem;margin:30px 0 14px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}h2.section-title::before{content:'';width:4px;height:16px;background:var(--accent-gradient);border-radius:4px}.doc-card{background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;border:1px solid var(--border-color)}.doc-title{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:6px}.doc-title i{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--accent-gradient);border-radius:8px;color:#fff;font-size:.85rem;flex-shrink:0}.doc-desc{font-size:.82rem;color:var(--text-secondary);margin-bottom:10px}.doc-url-row{display:flex;align-items:center;gap:8px;background:var(--bg-primary);border-radius:8px;padding:8px 10px;margin-bottom:10px}.doc-url-row code{flex:1;font-family:monospace;font-size:.7rem;color:var(--accent-cyan);word-break:break-all}.doc-copy-btn{background:rgba(255,255,255,.08);border:none;color:var(--text-primary);padding:5px 9px;border-radius:6px;font-size:.68rem;cursor:pointer;flex-shrink:0}.doc-params{font-size:.72rem;color:var(--text-secondary);margin-bottom:10px}.doc-params span{color:var(--text-primary);font-family:monospace}.doc-tabs{display:flex;gap:6px;margin-bottom:8px}.doc-tab-btn{background:var(--bg-primary);border:1px solid var(--border-color);color:var(--text-secondary);padding:5px 12px;border-radius:8px;font-size:.7rem;cursor:pointer}.doc-tab-btn.active{background:var(--accent-gradient);color:#fff;border-color:transparent}.doc-code-block{position:relative}.doc-code-block pre{background:var(--bg-primary);border-radius:8px;padding:10px 12px;font-size:.68rem;overflow-x:auto;color:var(--text-secondary);margin-bottom:4px;white-space:pre-wrap;word-break:break-all}.doc-code-block.hidden{display:none}.cta-card{text-align:center;background:var(--accent-gradient);border-radius:var(--radius);padding:24px;margin-top:30px;color:#fff}.cta-card a{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);padding:10px 20px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:.85rem}
</style>
</head>
<body>
<header>
<div class="brand"><i class="fas fa-book"></i><span>Documentación</span></div>
<div class="header-actions">
<a class="bot-docs-btn" href="/bot-docs"><i class="fas fa-book-open"></i> Bot Docs</a>
<button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
<a href="/" class="home-btn"><i class="fas fa-house"></i></a>
</div>
</header>
<main>
<div class="intro"><h1>FamilyBot-MD API</h1><p>Todos los endpoints disponibles, actualizados en tiempo real.</p><div class="base-url" id="baseUrl">https://tu-api.onrender.com</div></div>
<div id="docsContent"></div>
<div class="cta-card"><div style="font-weight:800;font-size:1.1rem">¿Quieres tu propia API Key?</div><div style="font-size:.85rem;margin-top:6px;opacity:.9">Regístrate gratis y empieza a usar todos estos endpoints</div><a href="/register">Crear cuenta gratis</a></div>
</main>
<script>
const savedTheme=localStorage.getItem('familybot_theme')||'dark';document.documentElement.setAttribute('data-theme',savedTheme);function updateThemeIcon(){const isLight=document.documentElement.getAttribute('data-theme')==='light';document.getElementById('themeBtn').innerHTML=isLight?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>'}updateThemeIcon();document.getElementById('themeBtn').addEventListener('click',()=>{const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('familybot_theme',next);updateThemeIcon()});const origin=window.location.origin;document.getElementById('baseUrl').innerText=origin;function buildExampleUrl(ep){const params=['apiKey=TU_API_KEY',...ep.fields.map(f=>`${f.name}=${f.default||'valor'}`)];return `${origin}${ep.path}?${params.join('&')}`}function buildCurl(ep){return `curl "${buildExampleUrl(ep)}"`}function buildJs(ep){return `fetch("${buildExampleUrl(ep)}")\n  .then(res => res.json())\n  .then(data => console.log(data));`}function renderDocCard(ep,uid){const exampleResponse=ep.example?JSON.stringify(ep.example,null,2):'// Este endpoint todavía no tiene un ejemplo de respuesta configurado';const paramsList=['apiKey',...ep.fields.map(f=>f.name)];return `<div class="doc-card"><div class="doc-title"><i class="${ep.icon}"></i>${ep.title}</div><div class="doc-desc">${ep.description}</div><div class="doc-url-row"><code id="docUrl_${uid}">GET ${ep.path}?${paramsList.map(p=>`${p}=...`).join('&')}</code><button class="doc-copy-btn" data-copy="docUrl_${uid}">Copiar</button></div><div class="doc-params">Parámetros: ${paramsList.map(p=>`<span>${p}</span>`).join(', ')}</div><div class="doc-tabs"><button class="doc-tab-btn active" data-tab="curl_${uid}" onclick="switchDocTab('${uid}','curl')">cURL</button><button class="doc-tab-btn" data-tab="js_${uid}" onclick="switchDocTab('${uid}','js')">JavaScript</button><button class="doc-tab-btn" data-tab="res_${uid}" onclick="switchDocTab('${uid}','res')">Respuesta</button></div><div class="doc-code-block" id="block_curl_${uid}"><pre id="code_curl_${uid}">${buildCurl(ep)}</pre><button class="doc-copy-btn" data-copy="code_curl_${uid}">Copiar código</button></div><div class="doc-code-block hidden" id="block_js_${uid}"><pre id="code_js_${uid}">${buildJs(ep)}</pre><button class="doc-copy-btn" data-copy="code_js_${uid}">Copiar código</button></div><div class="doc-code-block hidden" id="block_res_${uid}"><pre id="code_res_${uid}">${exampleResponse}</pre><button class="doc-copy-btn" data-copy="code_res_${uid}">Copiar JSON</button></div></div>`}function switchDocTab(uid,tab){['curl','js','res'].forEach(t=>document.getElementById(`block_${t}_${uid}`).classList.toggle('hidden',t!==tab));document.querySelectorAll(`[data-tab$="_${uid}"]`).forEach(btn=>btn.classList.toggle('active',btn.getAttribute('data-tab')===`${tab}_${uid}`))}window.switchDocTab=switchDocTab;function bindCopyButtons(){document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{const targetId=btn.getAttribute('data-copy'),text=document.getElementById(targetId).innerText;try{await navigator.clipboard.writeText(text);const original=btn.innerText;btn.innerText='¡Copiado!';setTimeout(()=>btn.innerText=original,1500)}catch(e){btn.innerText='Error al copiar'}}))}async function loadDocs(){try{const res=await fetch('/api/endpoints');const data=await res.json();if(!data.status||!data.endpoints)return;const groups={};data.endpoints.forEach(ep=>{if(!groups[ep.category])groups[ep.category]={label:ep.categoryLabel,items:[]};groups[ep.category].items.push(ep)});const container=document.getElementById('docsContent');let html='',uid=0;Object.keys(groups).forEach(categoryKey=>{const group=groups[categoryKey];html+=`<h2 class="section-title">${group.label}</h2>`;group.items.forEach(ep=>{uid++;html+=renderDocCard(ep,uid)})});container.innerHTML=html||'<p style="color:var(--text-secondary);text-align:center">Todavía no hay endpoints publicados.</p>';bindCopyButtons()}catch(err){document.getElementById('docsContent').innerHTML='<p style="color:var(--text-secondary);text-align:center">No se pudo cargar la documentación.</p>'}}loadDocs();
</script>
</body>
</html>
