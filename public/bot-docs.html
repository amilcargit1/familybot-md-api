<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyBot-MD · Guía para bots</title>
<style>
:root{--bg:#0a0b0e;--card:#14161c;--text:#f1f5f9;--muted:#94a3b8;--accent:#ec4899;--cyan:#22d3ee;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(10,11,14,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px}main{max-width:1000px;margin:auto;padding:24px 16px 60px}.brand{font-weight:800;font-size:1.1rem}.brand span{color:var(--accent)}.intro{text-align:center;margin:20px 0 24px}.intro h1{margin-bottom:8px}.intro p{color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tools input,.tools select{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin:12px 0}.title{font-weight:800;font-size:1rem}.method{display:inline-block;padding:4px 7px;border-radius:6px;background:rgba(34,211,238,.1);color:var(--cyan);font:700 .7rem monospace;margin-right:7px}.path{font-family:monospace;word-break:break-all}.muted{color:var(--muted);font-size:.85rem}.params{margin:12px 0}.param{display:inline-block;background:rgba(255,255,255,.06);padding:4px 7px;border-radius:6px;margin:3px;font: .72rem monospace}.code{position:relative;margin-top:12px}.code pre{background:#090a0d;border:1px solid var(--border);border-radius:10px;padding:13px;overflow:auto;white-space:pre-wrap;font-size:.75rem;color:#dbe4ee}.btn{border:0;border-radius:9px;padding:8px 11px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.copy{float:right;margin-top:-4px}.empty{text-align:center;color:var(--muted);padding:30px}.badge{color:var(--cyan);font-size:.75rem}
</style>
</head>
<body>
<header><div class="brand">📚 <span>FamilyBot-MD</span> · Guía de API para bots</div></header>
<main>
<section class="intro"><h1>Cómo usar cada endpoint en un bot de WhatsApp</h1><p>Selecciona un endpoint, revisa sus parámetros y copia una plantilla de comando para Baileys.</p></section>
<div class="tools"><input id="search" placeholder="Buscar endpoint..." autocomplete="off"><select id="category"><option value="">Todas las categorías</option></select></div>
<div id="content"><div class="empty">Cargando endpoints...</div></div>
</main>
<script>
const origin=location.origin;let endpoints=[];
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
function exampleUrl(ep){const qs=['apiKey=TU_API_KEY'];for(const f of(ep.fields||[])){const v=f.default!==undefined?f.default:(f.type==='select'?(f.options?.[0]?.value||'valor'):'valor');qs.push(encodeURIComponent(f.name)+'='+encodeURIComponent(v));}return origin+ep.path+(qs.length?'?'+qs.join('&'):'')}
function commandCode(ep){const url=exampleUrl(ep);const imageLike=['image','buffer','file','media'].includes(String(ep.resultType||'').toLowerCase())||/image|canvas|wallpaper|qr|filter|waifu|reaction/i.test(ep.path+' '+ep.title);return `// Comando: ${String(ep.title||'endpoint').replace(/\r?\n/g,' ')}\n// Cambia API_KEY por la clave de tu cuenta.\n\nconst API_URL = '${origin}';\nconst API_KEY = process.env.FAMILYBOT_API_KEY;\n\nconst url = '${url.replace(/TU_API_KEY/g,"' + API_KEY + '")}';\nconst response = await fetch(url);\n\nif (!response.ok) {\n  throw new Error('API HTTP ' + response.status);\n}\n\n${imageLike?`const buffer = Buffer.from(await response.arrayBuffer());\n\nawait sock.sendMessage(chatId, {\n  image: buffer,\n  caption: '${String(ep.title||'Resultado').replace(/'/g,"\\'")}'\n});`:`const data = await response.json();\n\nawait sock.sendMessage(chatId, {\n  text: JSON.stringify(data, null, 2)\n});`}`}
function render(){const q=document.getElementById('search').value.toLowerCase();const cat=document.getElementById('category').value;const list=endpoints.filter(e=>(!cat||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));const c=document.getElementById('content');if(!list.length){c.innerHTML='<div class="empty">No se encontraron endpoints.</div>';return}c.innerHTML=list.map((e,i)=>{const id='e'+i;const params=(e.fields||[]).map(f=>`<span class="param">${esc(f.name)}</span>`).join('')||'<span class="muted">Sin parámetros adicionales</span>';const code=esc(commandCode(e));return `<article class="card"><div class="title"><span class="method">${esc(e.method||'GET')}</span><span class="path">${esc(e.path)}</span></div><p>${esc(e.description||'Sin descripción')}</p><div class="badge">Resultado: ${esc(e.resultType||'raw')}</div><div class="params"><b>Parámetros:</b> ${params}</div><details><summary>🧩 Cómo crear el comando</summary><div class="code"><button class="btn copy" data-code="${id}">Copiar</button><pre id="${id}">${code}</pre></div></details></article>`}).join('');c.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(document.getElementById(b.dataset.code).innerText);b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar',1200)})}
async function load(){try{const r=await fetch('/api/endpoints');const d=await r.json();endpoints=d.endpoints||[];const cats=[...new Map(endpoints.map(e=>[e.category,e.categoryLabel||e.category])).entries()];document.getElementById('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');render()}catch(e){document.getElementById('content').innerHTML='<div class="empty">No se pudo cargar la documentación.</div>'}}
document.getElementById('search').oninput=render;document.getElementById('category').onchange=render;load();
</script>
</body>
</html>
