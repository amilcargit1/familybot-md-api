<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyBot-MD · Guía para bots</title>
<style>
:root{--bg:#0a0b0e;--card:#14161c;--text:#f1f5f9;--muted:#94a3b8;--accent:#ec4899;--cyan:#22d3ee;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(10,11,14,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px}main{max-width:1000px;margin:auto;padding:24px 16px 60px}.brand{font-weight:800;font-size:1.1rem}.brand span{color:var(--accent)}.intro{text-align:center;margin:20px 0 24px}.intro h1{margin-bottom:8px}.intro p{color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tools input,.tools select{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin:12px 0}.title{font-weight:800;font-size:1rem}.method{display:inline-block;padding:4px 7px;border-radius:6px;background:rgba(34,211,238,.1);color:var(--cyan);font:700 .7rem monospace;margin-right:7px}.path{font-family:monospace;word-break:break-all}.muted{color:var(--muted);font-size:.85rem}.params{margin:12px 0}.param{display:inline-block;background:rgba(255,255,255,.06);padding:4px 7px;border-radius:6px;margin:3px;font:.72rem monospace}.code{position:relative;margin-top:12px}.code pre{background:#090a0d;border:1px solid var(--border);border-radius:10px;padding:13px;overflow:auto;white-space:pre-wrap;font-size:.75rem;color:#dbe4ee}.btn{border:0;border-radius:9px;padding:8px 11px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.copy{float:right;margin-top:-4px}.empty{text-align:center;color:var(--muted);padding:30px}.badge{color:var(--cyan);font-size:.75rem}.hint{color:var(--muted);font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<header><div class="brand">📚 <span>FamilyBot-MD</span> · Guía de API para bots</div></header>
<main>
<section class="intro"><h1>Cómo usar cada endpoint en un bot de WhatsApp</h1><p>Selecciona un endpoint, revisa sus parámetros y copia una plantilla compatible con Baileys.</p></section>
<div class="tools"><input id="search" placeholder="Buscar endpoint..." autocomplete="off"><select id="category"><option value="">Todas las categorías</option></select></div>
<div id="content"><div class="empty">Cargando endpoints...</div></div>
</main>
<script>
const origin=location.origin;let endpoints=[];
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
const clean=s=>String(s??'').replace(/\r?\n/g,' ').replace(/'/g,"\\'");
function valueFor(f){if(f.default!==undefined)return f.default;if(f.type==='select')return f.options?.[0]?.value||'valor';return f.placeholder?String(f.placeholder).replace(/\.\.\.$/,''):'valor'}
function exampleUrl(ep,forceImage=false){const qs=['apiKey=TU_API_KEY'];for(const f of(ep.fields||[])){if(f.type==='file')continue;if(f.name==='avatarUrl'&&forceImage)continue;qs.push(encodeURIComponent(f.name)+'='+encodeURIComponent(valueFor(f)));}if(forceImage)qs.push('format=image');return origin+ep.path+(qs.length?'?'+qs.join('&'):'')}
function apiUrl(ep,forceImage=false){return exampleUrl(ep,forceImage).replace('TU_API_KEY',"' + API_KEY + '")}
function requestCode(ep){const method=String(ep.method||'GET').toUpperCase();return method==='GET'?`const response = await fetch(url);`:`const response = await fetch(url, { method: '${method}', body: form });`}
function isMultipart(ep){return String(ep.example?.contentType||'').toLowerCase().includes('multipart') || (ep.fields||[]).some(f=>f.type==='file')}
function commandCode(ep){const type=String(ep.resultType||'raw').toLowerCase();const title=clean(ep.title||'Endpoint');
if(isMultipart(ep)&&String(ep.method||'GET').toUpperCase()!=='GET'){
  const fields=(ep.fields||[]).filter(f=>f.name!=='avatarUrl');
  const appends=fields.map(f=>{if(f.type==='file')return `form.append('${f.name}', new Blob([fs.readFileSync('./avatar.jpg')], { type: 'image/jpeg' }), 'avatar.jpg');`;return `form.append('${f.name}', '${clean(valueFor(f))}');`;}).join('\n');
  const url=apiUrl(ep,true);
  let media='';
  if(type==='image'||type==='buffer'||type==='media'||type==='file')media=`const buffer = Buffer.from(await response.arrayBuffer());\n\nawait sock.sendMessage(chatId, {\n  image: buffer,\n  caption: '${title}'\n});`;
  else media=`const data = await response.json();\nawait sock.sendMessage(chatId, { text: JSON.stringify(data, null, 2) });`;
  return `// ${title}\nconst fs = require('node:fs');\nconst API_KEY = process.env.FAMILYBOT_API_KEY;\n\nconst url = '${url}';\nconst form = new FormData();\n\n${appends}\n\nconst response = await fetch(url, {\n  method: 'POST',\n  body: form\n});\n\nif (!response.ok) {\n  throw new Error('API HTTP ' + response.status);\n}\n\n${media}`;
}
const url=apiUrl(ep,type==='image');const method=String(ep.method||'GET').toUpperCase();const request=method==='GET'?`const response = await fetch(url);`:`const response = await fetch(url, { method: '${method}' });`;const head=`// ${title}\nconst API_KEY = process.env.FAMILYBOT_API_KEY;\nconst url = '${url}';\n\n${request}\n\nif (!response.ok) {\n  throw new Error('API HTTP ' + response.status);\n}`;
if(type==='image'||type==='buffer'||type==='media'||type==='file')return `${head}\nconst buffer = Buffer.from(await response.arrayBuffer());\n\nawait sock.sendMessage(chatId, {\n  image: buffer,\n  caption: '${title}'\n});`;
if(type==='audio')return `${head}\nconst buffer = Buffer.from(await response.arrayBuffer());\n\nawait sock.sendMessage(chatId, {\n  audio: buffer,\n  mimetype: 'audio/mpeg'\n});`;
if(type==='video')return `${head}\nconst buffer = Buffer.from(await response.arrayBuffer());\n\nawait sock.sendMessage(chatId, {\n  video: buffer,\n  caption: '${title}'\n});`;
if(type==='link')return `${head}\nconst data = await response.json();\n\nawait sock.sendMessage(chatId, {\n  text: data.url || data.result?.url || data.download || JSON.stringify(data, null, 2)\n});`;
return `${head}\nconst data = await response.json();\n\nawait sock.sendMessage(chatId, {\n  text: JSON.stringify(data, null, 2)\n});`;
}
function render(){const q=document.getElementById('search').value.toLowerCase();const cat=document.getElementById('category').value;const list=endpoints.filter(e=>(!cat||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));const c=document.getElementById('content');if(!list.length){c.innerHTML='<div class="empty">No se encontraron endpoints.</div>';return}c.innerHTML=list.map((e,i)=>{const id='e'+i;const params=(e.fields||[]).map(f=>`<span class="param">${esc(f.name)}</span>`).join('')||'<span class="muted">Sin parámetros adicionales</span>';const code=esc(commandCode(e));return `<article class="card"><div class="title"><span class="method">${esc(e.method||'GET')}</span><span class="path">${esc(e.path)}</span></div><p>${esc(e.description||'Sin descripción')}</p><div class="badge">Resultado: ${esc(e.resultType||'raw')}</div><div class="params"><b>Parámetros:</b> ${params}</div><details><summary>🧩 Cómo crear el comando</summary><div class="hint">La plantilla se genera automáticamente. Los endpoints multipart generan FormData y adjuntan el archivo cuando corresponde.</div><div class="code"><button class="btn copy" data-code="${id}">Copiar</button><pre id="${id}">${code}</pre></div></details></article>`}).join('');c.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(document.getElementById(b.dataset.code).innerText);b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar',1200)})}
async function load(){try{const r=await fetch('/api/endpoints');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();endpoints=Array.isArray(d.endpoints)?d.endpoints:[];const cats=[...new Map(endpoints.map(e=>[e.category,e.categoryLabel||e.category])).entries()];document.getElementById('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');render()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="empty">No se pudo cargar la documentación.</div>'}}
document.getElementById('search').oninput=render;document.getElementById('category').onchange=render;load();
</script>
</body>
</html>
