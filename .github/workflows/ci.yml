name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check project syntax
        run: |
          node --check index.js
          find commands routes lib -type f -name '*.js' -print0 2>/dev/null | xargs -0 -r -n1 node --check

      - name: Verify package
        run: npm run lint --if-present