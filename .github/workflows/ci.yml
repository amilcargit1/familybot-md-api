name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project syntax
        run: |
          node --check index.js
          find . \
            -type f \
            -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 node --check

      - name: Verify package
        run: npm run lint --if-present

      - name: Verify project files
        run: |
          test -f package.json
          test -f index.js
          test -d routes
          test -d utils